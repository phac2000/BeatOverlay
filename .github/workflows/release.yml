name: Build APK

on:
  push:
    tags:
      - "[vV]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BeatOverlay-${{ github.ref_name }}.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: BeatOverlay-${{ github.ref_name }}.apk
